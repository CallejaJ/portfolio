<svg viewBox="0 0 220 100" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#fef3c7;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#fde68a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#fbbf24;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Fondo con degradado -->
  <rect width="220" height="100" fill="url(#bgGradient)"/>

  <!-- Document shield base - Corner brackets (bajados +20px) -->
  <g fill="none" stroke="#d97706" stroke-width="2">
    <path d="M8 36 L8 28 L16 28" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M32 28 L40 28 L40 36" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M8 52 L8 60 L16 60" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M40 52 L40 60 L32 60" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- Document shape (bajado +20px) -->
  <rect
    x="15"
    y="34"
    width="18"
    height="22"
    fill="rgb(156 163 175)"
    stroke="rgb(107 114 128)"
    stroke-width="1.5"
    rx="1"
  />

  <!-- Document content lines (bajadas +20px) -->
  <g stroke="rgb(75 85 99)" stroke-width="1.2">
    <line x1="18" y1="40" x2="30" y2="40" stroke-linecap="round" />
    <line x1="18" y1="44" x2="30" y2="44" stroke-linecap="round" />
    <line x1="18" y1="48" x2="27" y2="48" stroke-linecap="round" />
  </g>

  <!-- Security checkmark (bajado +20px) -->
  <path
    d="M20 50 L22.5 52.5 L28 47"
    fill="none"
    stroke="#d97706"
    stroke-width="2.5"
    stroke-linecap="round"
    stroke-linejoin="round"
  />

  <!-- DOCUDID text (bajado +20px) -->
  <text
    x="54"
    y="48"
    font-family="Inter, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"
    font-size="24"
    font-weight="700"
    fill="#78350f"
  >
    DOCUDID
  </text>

  <!-- Subtle tagline (bajado +20px) -->
  <text
    x="54"
    y="58"
    font-family="Inter, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"
    font-size="8"
    font-weight="500"
    fill="#92400e"
  >
    AI-Powered Document Security
  </text>
</svg>